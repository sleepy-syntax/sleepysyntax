name: Deploy to server

on:
    workflow_dispatch:

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            # 1. Pull the codebase onto the GitHub runner
            - name: Checkout Code
              uses: actions/checkout@v4

            # 2. Set up pnpm on the runner
            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11.15.1

            # 3. Initialize Node.js and cache pnpm global store
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24.21.0
                  cache: 'pnpm'

            # 4. Install dependencies exactly as locked and compile the app
            - name: Install & Build
              run: |
                  pnpm install --prod --frozen-lockfile --ignore-scripts
                  pnpm build

            # 5. Securely sync files to the server via SSH
            - name: Deploy to Server via SSH
              uses: easingthemes/ssh-deploy@v6.0.3
              with:
                  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
                  REMOTE_HOST: ${{ secrets.SERVER_IP }}
                  REMOTE_USER: ${{ secrets.SERVER_USER }}
                  REMOTE_PORT: ${{ secrets.SERVER_PORT }}
                  SOURCE: 'dist/'
                  TARGET: ${{ secrets.SERVER_TARGET }}
                  ARGS: '-rlgoDzvc --delete'
